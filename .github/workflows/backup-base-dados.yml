# Cópia de segurança diária da base de dados Supabase (produção).
#
# O ficheiro é CIFRADO (AES-256) antes de sair do servidor do GitHub,
# porque o repositório é público. Só quem tem a frase-passe
# (BACKUP_PASSPHRASE) consegue abri-lo. Ver docs/COPIAS_DE_SEGURANCA.md.
#
# Segredos necessários (GitHub → Settings → Secrets and variables → Actions):
#   SUPABASE_DB_PASSWORD — palavra-passe da base de dados (Supabase → Project Settings → Database)
#   BACKUP_PASSPHRASE    — frase-passe longa, guardada também num gestor de palavras-passe
# Opcional: SUPABASE_DB_URL — endereço completo "Session pooler"; se existir, é usado em vez da
# deteção automática do servidor.

name: Cópia de segurança da base de dados

on:
  schedule:
    - cron: "17 3 * * *"   # todos os dias às 03:17 UTC
  workflow_dispatch: {}    # permite correr manualmente

permissions:
  contents: read

concurrency:
  group: backup-base-dados
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT_REF: yrfdxocwhztokadzxtto        # identificador público do projeto (não é segredo)
      PROJECT_REGION: eu-west-1
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Confirmar que os segredos existem
        run: |
          if [ -z "$SUPABASE_DB_URL" ] && [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Falta o segredo SUPABASE_DB_PASSWORD."
            exit 1
          fi
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Falta o segredo BACKUP_PASSPHRASE."
            exit 1
          fi
          if [ "${#BACKUP_PASSPHRASE}" -lt 20 ]; then
            echo "::error::BACKUP_PASSPHRASE demasiado curta (mínimo 20 caracteres)."
            exit 1
          fi

      - name: Instalar cliente PostgreSQL 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 > /dev/null
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Encontrar o servidor de ligação (pooler)
        run: |
          if [ -n "$SUPABASE_DB_URL" ]; then
            echo "A usar o endereço fornecido em SUPABASE_DB_URL."
            echo "PGCONN=$SUPABASE_DB_URL" >> "$GITHUB_ENV"
            exit 0
          fi
          export PGPASSWORD="$SUPABASE_DB_PASSWORD" PGSSLMODE=require PGCONNECT_TIMEOUT=10
          for prefixo in aws-0 aws-1; do
            host="$prefixo-$PROJECT_REGION.pooler.supabase.com"
            if /usr/lib/postgresql/17/bin/psql "host=$host port=5432 dbname=postgres user=postgres.$PROJECT_REF" -Atc "select 1" > /dev/null 2>erro.txt; then
              echo "Servidor encontrado: $host"
              echo "PGCONN=host=$host port=5432 dbname=postgres user=postgres.$PROJECT_REF sslmode=require" >> "$GITHUB_ENV"
              rm -f erro.txt
              exit 0
            fi
            echo "$host: $(head -c 200 erro.txt | sed 's/password=[^ ]*//')"
          done
          echo "::error::Não foi possível ligar à base de dados. Confirme a palavra-passe em SUPABASE_DB_PASSWORD."
          exit 1

      - name: Exportar a base de dados
        run: |
          umask 077
          export PGPASSWORD="$SUPABASE_DB_PASSWORD"
          /usr/lib/postgresql/17/bin/pg_dump "$PGCONN" \
            --format=custom --no-owner --no-privileges \
            --schema=public --schema=private --schema=auth --schema=storage \
            --file=backup.dump
          echo "Tamanho: $(du -h backup.dump | cut -f1)"

      - name: Verificar a cópia (sem mostrar dados)
        run: |
          PGR=/usr/lib/postgresql/17/bin/pg_restore
          $PGR --list backup.dump > conteudo.txt
          tabelas=$(grep -c " TABLE DATA public " conteudo.txt || true)
          echo "Tabelas com dados (public): $tabelas"
          for t in alunos profiles pagamentos turmas presencas contratos; do
            if ! grep -q " TABLE DATA public $t " conteudo.txt; then
              echo "::error::A cópia não contém a tabela $t"; exit 1
            fi
          done
          if ! grep -q " TABLE DATA auth users " conteudo.txt; then
            echo "::error::A cópia não contém as contas de utilizador (auth.users)"; exit 1
          fi
          echo "Verificação OK"

      - name: Cifrar (AES-256)
        run: |
          umask 077
          NOME="gbbraga-backup-$(date -u +%Y-%m-%dT%H%MZ).dump.gpg"
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --quiet \
            --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 --s2k-digest-algo SHA512 --s2k-count 65011712 \
            --output "$NOME" backup.dump
          shred -u backup.dump conteudo.txt
          echo "NOME=$NOME" >> "$GITHUB_ENV"

      - name: Guardar a cópia cifrada (30 dias)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NOME }}
          path: ${{ env.NOME }}
          retention-days: 30
          if-no-files-found: error
